<meta charset="UTF-8">

<style>
  :root{--ink:#2b2117;--gold:#9c7c41;--gold-soft:#b89a5e;--cream:#f3ecdd;--paper:#faf5ea;--line:rgba(156,124,65,.30);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Jost',sans-serif;color:var(--ink);background:#e9e2d2;padding:24px;}
  .sheet{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;max-width:900px;margin:0 auto;}
  .qcard{width:380px;background:linear-gradient(180deg,var(--paper),var(--cream));border:1px solid var(--line);border-radius:6px;padding:34px 30px 28px;position:relative;text-align:center;box-shadow:0 18px 40px -20px rgba(0,0,0,.4);}
  .qcard::before,.qcard::after{content:"";position:absolute;width:24px;height:24px;border-color:var(--gold);border-style:solid;opacity:.55;}
  .qcard::before{top:12px;left:12px;border-width:1px 0 0 1px;}
  .qcard::after{bottom:12px;right:12px;border-width:0 1px 1px 0;}
  .nm{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;letter-spacing:.06em;}
  .sub{font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-top:6px;}
  .rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0;}
  .rule span{height:1px;width:46px;}
  .rule span:first-child{background:linear-gradient(90deg,transparent,var(--gold));}
  .rule span:last-child{background:linear-gradient(90deg,var(--gold),transparent);}
  .rule .dot{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);}
  .qr{width:230px;height:230px;margin:6px auto 4px;background:#fff;padding:14px;border:1px solid var(--line);border-radius:4px;}
  .qr img{width:100%;height:100%;display:block;}
  .lbl{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;margin-top:14px;}
  .desc{font-size:11px;color:#6a5c47;line-height:1.5;margin-top:6px;padding:0 6px;}
  .scan{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-top:14px;}
  @media print{body{background:#fff;padding:0;}.qcard{box-shadow:none;page-break-inside:avoid;}.sheet{gap:14px;}}
</style>
</head>
